---
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart backend
  ansible.builtin.systemd:
    name: "{{ backend_service_name }}"
    state: restarted
    daemon_reload: true

- name: Reload nginx
  ansible.builtin.shell: nginx -t && systemctl reload nginx
  changed_when: true
