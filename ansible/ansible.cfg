[defaults]
inventory            = inventory/hosts.yml
roles_path           = roles
remote_user          = ubuntu
host_key_checking    = False
retry_files_enabled  = False
interpreter_python   = auto_silent
forks                = 10
timeout              = 60
deprecation_warnings = False
callbacks_enabled    = ansible.posix.profile_tasks

[privilege_escalation]
become        = True
become_method = sudo
become_user   = root

[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30 -o UserKnownHostsFile=/dev/null
